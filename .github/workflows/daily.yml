name: daily-live-score
on:
  schedule: [{cron: '30 0 * * *'}]   # 06:00 IST every day
  workflow_dispatch:
permissions: {contents: write}
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python src/predict.py live
      - run: |
          git config user.name van-agni-bot; git config user.email van-agni-bot@users.noreply.github.com
          git add docs/live.json; git commit -m "daily live score $(date -u +%F)" || echo nothing; git push
